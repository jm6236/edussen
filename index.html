<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기출자료 발송내역 관리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <!-- 구글 파이어베이스(Firebase) 핵심 도구 불러오기 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
            font-weight: 500;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white text-base">

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-[95rem] mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between py-3">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-paper-plane text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">기출자료 발송내역</h1>
                    <p class="text-sm text-slate-600 font-semibold hidden sm:block mt-0.5">시험일정 및 과목별 시험범위 발송 관리 시스템</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-3">
                <div id="admin-auth-container" class="flex items-center gap-2"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-[95rem] mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        <div class="space-y-6 mb-6">
            <div id="stats-section" class="grid grid-cols-2 md:grid-cols-4 gap-4 hidden">
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <div class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">전체 신청건수</div>
                    <div class="text-3xl font-black text-slate-900" id="stat-total">0</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <div class="text-emerald-700 text-xs font-bold uppercase tracking-wider mb-1">발송 완료</div>
                    <div class="text-3xl font-black text-emerald-600" id="stat-completed">0</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <div class="text-rose-700 text-xs font-bold uppercase tracking-wider mb-1">미발송 (대기)</div>
                    <div class="text-3xl font-black text-rose-600" id="stat-pending">0</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <div class="text-blue-700 text-xs font-bold uppercase tracking-wider mb-1">발송 완료율</div>
                    <div class="text-3xl font-black text-blue-600" id="stat-rate">0%</div>
                </div>
            </div>

            <!-- 기출문제 신청하기 버튼 (일반 사용자용) -->
            <div id="client-apply-section" class="flex justify-center my-6">
                <button onclick="openModal('add')" class="w-full sm:w-auto px-12 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 active:scale-95 text-white font-bold text-xl rounded-2xl shadow-xl shadow-blue-500/30 transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-paper-plane text-xl"></i>
                    <span>기출문제 신청하기</span>
                </button>
            </div>

            <div id="search-filter-section" class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between hidden">
                <div class="flex items-center gap-3 w-full md:w-auto flex-1">
                    <div class="relative w-full md:w-96">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-base"></i>
                        </div>
                        <input type="text" id="search-input" oninput="renderTable()" placeholder="학생명, 학교명, 과목, 출판사, 저자 검색..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-base font-semibold text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                    </div>
                    <button onclick="deleteSelectedRecords()" class="inline-flex items-center gap-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-sm font-bold px-4 py-2.5 rounded-xl transition-all shadow-sm shrink-0">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>선택 삭제</span>
                    </button>
                </div>

                <div class="flex items-center gap-1 bg-slate-100 p-1.5 rounded-xl border border-slate-200/60 w-full md:w-auto overflow-x-auto shrink-0">
                    <button onclick="setFilter('all')" id="filter-all" class="filter-tab px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-slate-900 shadow-sm">
                        전체
                    </button>
                    <button onclick="setFilter('발송완료')" id="filter-completed" class="filter-tab px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all">
                        발송완료
                    </button>
                    <button onclick="setFilter('미발송')" id="filter-pending" class="filter-tab px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all">
                        미발송
                    </button>
                </div>
            </div>
        </div>

        <!-- Table Card -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-base border-collapse">
                    <thead>
                        <tr class="bg-slate-50/90 border-b border-slate-200 text-slate-700 font-bold text-sm tracking-wider">
                            <th id="th-select-all" class="py-4 px-3 w-14 text-center hidden">
                                <input type="checkbox" id="select-all-checkbox" onclick="toggleSelectAll(this)" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-5 h-5 cursor-pointer">
                            </th>
                            <th class="py-4 px-3 w-24 text-center">학생명</th>
                            <th class="py-4 px-3 w-36 text-center">학교명</th>
                            <th class="py-4 px-2 w-16 text-center">학년</th>
                            <th class="py-4 px-2 w-36 text-center">시험일정</th>
                            <th class="py-4 px-6 text-center">시험범위 (과목·출판사·저자)</th>
                            <th class="py-4 px-4 w-32 text-center">담당 매니저</th>
                            <th id="th-dispatch-action" class="py-4 px-4 w-32 text-center hidden">발송확인</th>
                            <th id="th-admin-action" class="py-4 px-4 w-28 text-right hidden">관리</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100 text-slate-900 font-medium">
                        <tr>
                            <td colspan="8" class="py-16 text-center text-slate-400 font-medium">데이터를 불러오는 중입니다...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div id="empty-state" class="hidden py-20 text-center">
                <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-slate-400">
                    <i class="fa-solid fa-folder-open text-2xl"></i>
                </div>
                <p class="text-slate-700 font-bold text-lg">표시할 내역이 없습니다.</p>
                <p class="text-slate-500 text-sm mt-1">기출문제 신청하기 버튼을 눌러 새로운 내역을 등록해 보세요.</p>
            </div>
        </div>
    </main>

    <!-- Modal: Add / Edit -->
    <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white text-slate-900 rounded-3xl shadow-2xl border border-slate-100 w-full max-w-2xl overflow-hidden transform transition-all my-8 flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/90 shrink-0">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">기출문제 신청</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 p-1.5 rounded-xl transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="data-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-5 overflow-y-auto flex-1">
                <input type="hidden" id="edit-id">

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-800 mb-1.5">학생명 (최대 6자) <span class="text-rose-500">*</span></label>
                        <input type="text" id="studentName" maxlength="6" required placeholder="예: 김철수" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-base font-semibold text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-800 mb-1.5">학교명 <span class="text-rose-500">*</span></label>
                        <input type="text" id="schoolName" required placeholder="예: 한국고등학교" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-base font-semibold text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-800 mb-1.5">학년 <span class="text-rose-500">*</span></label>
                        <input type="text" id="grade" required placeholder="예: 고2, 중3" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-base font-semibold text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-800 mb-1.5">시험일정 <span class="text-rose-500">*</span></label>
                    <div class="flex items-center gap-3">
                        <input type="date" id="startDate" required class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-base font-semibold text-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <span class="text-slate-400 font-bold text-lg">~</span>
                        <input type="date" id="endDate" required class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-base font-semibold text-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-bold text-slate-800">시험범위 과목별 입력 <span class="text-rose-500">*</span></label>
                        <button type="button" onclick="addRangeRow()" class="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 active:scale-95 text-sm font-bold px-3.5 py-2 rounded-xl transition-all border border-slate-300 shadow-sm">
                            <i class="fa-solid fa-plus text-xs"></i>
                            <span>과목 추가</span>
                        </button>
                    </div>
                    <div id="range-list-container" class="space-y-4"></div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-800 mb-1.5">담당 매니저 <span class="text-slate-400 text-xs font-normal">(선택입력)</span></label>
                    <input type="text" id="manager" placeholder="담당 매니저 성함 직접 입력 (모를 경우 공백)" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-base font-semibold text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-5 py-3 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
                        취소
                    </button>
                    <button type="submit" class="px-6 py-3 text-base font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition-colors shadow-md shadow-blue-500/20">
                        저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Admin Password Login -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 w-full max-w-sm overflow-hidden p-6">
            <div class="text-center mb-4">
                <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl border border-amber-200 flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-shield text-2xl"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900">관리자 인증</h3>
                <p class="text-sm text-slate-600 mt-1">수정 및 삭제 권한을 위해 비밀번호를 입력하세요.</p>
            </div>

            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <input type="password" id="admin-password" placeholder="비밀번호 입력" required class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-base font-semibold text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="flex items-center justify-end gap-2">
                    <button type="button" onclick="closeLoginModal()" class="w-1/2 py-3 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-xl">
                        취소
                    </button>
                    <button type="submit" class="w-1/2 py-3 text-base font-bold bg-slate-900 hover:bg-slate-800 text-white rounded-xl shadow-md">
                        로그인
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Change Admin Password -->
    <div id="password-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 w-full max-w-sm overflow-hidden p-6">
            <div class="text-center mb-4">
                <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl border border-blue-200 flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-key text-2xl"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900">관리자 비밀번호 변경</h3>
                <p class="text-sm text-slate-600 mt-1">새로 사용할 비밀번호를 입력하세요.</p>
            </div>

            <form onsubmit="handlePasswordChange(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">현재 비밀번호</label>
                    <input type="password" id="current-password" placeholder="현재 비밀번호 입력" required class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-base font-semibold text-slate-950 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">새 비밀번호</label>
                    <input type="password" id="new-password" placeholder="새 비밀번호 입력" required class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-base font-semibold text-slate-950 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">새 비밀번호 확인</label>
                    <input type="password" id="confirm-password" placeholder="새 비밀번호 재입력" required class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-base font-semibold text-slate-950 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="flex items-center justify-end gap-2 pt-2">
                    <button type="button" onclick="closePasswordModal()" class="w-1/2 py-3 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-xl">
                        취소
                    </button>
                    <button type="submit" class="w-1/2 py-3 text-base font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md">
                        변경하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-20 opacity-0 z-50 text-base font-bold">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-message">처리가 완료되었습니다.</span>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAV-WfnFkuFskB8sK5hwLHv3_uBqLmyhsM",
            authDomain: "edussen-93f8a.firebaseapp.com",
            projectId: "edussen-93f8a",
            storageBucket: "edussen-93f8a.firebasestorage.app",
            messagingSenderId: "884280268684",
            appId: "1:884280268684:web:44b9bf5abbe18db30428a9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const PASSWORD_KEY = 'exam_admin_password_v4';
        const ADMIN_LOGIN_KEY = 'exam_admin_logged_in_v4';
        
        let records = [];
        let currentFilter = 'all';
        let isAdminLoggedIn = false;

        window.onload = function() {
            initPassword();
            if (localStorage.getItem(ADMIN_LOGIN_KEY) === 'true') {
                isAdminLoggedIn = true;
            }
            renderAdminAuthUI();
            loadRecords(); // 💡 초기 진입 시 빠르게 데이터 로드
        };

        function initPassword() {
            if (!localStorage.getItem(PASSWORD_KEY)) {
                localStorage.setItem(PASSWORD_KEY, 'admin1234');
            }
        }

        // 💡 데이터 로딩 속도 최적화 (최근 데이터 우선 정렬 및 비동기 처리 개선)
        function loadRecords() {
            db.collection("exam_records").orderBy("id", "desc").limit(200).get().then((querySnapshot) => {
                records = [];
                querySnapshot.forEach((doc) => {
                    records.push(doc.data());
                });
                updateStats();
                renderTable();
            }).catch((error) => {
                console.log("데이터 불러오기 실패: ", error);
                showToast('데이터를 불러오는 중 오류가 발생했습니다.');
            });
        }

        function saveRecordToFirebase(record, callback) {
            db.collection("exam_records").doc(record.id.toString()).set(record)
                .then(() => {
                    loadRecords();
                    if (callback) callback();
                })
                .catch((error) => {
                    console.error("데이터 저장 실패: ", error);
                    showToast('저장 중 오류가 발생했습니다.');
                });
        }

        function updateStats() {
            const total = records.length;
            const completed = records.filter(r => r.status === '발송완료').length;
            const pending = records.filter(r => r.status === '미발송').length;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-completed').innerText = completed;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-rate').innerText = `${rate}%`;

            const statsSection = document.getElementById('stats-section');
            const searchFilterSection = document.getElementById('search-filter-section');
            const clientApplySection = document.getElementById('client-apply-section');
            
            if (isAdminLoggedIn) {
                statsSection.classList.remove('hidden');
                searchFilterSection.classList.remove('hidden');
                if(clientApplySection) clientApplySection.classList.add('hidden');
            } else {
                statsSection.classList.add('hidden');
                searchFilterSection.classList.add('hidden');
                if(clientApplySection) clientApplySection.classList.remove('hidden');
            }
        }

        function renderAdminAuthUI() {
            const container = document.getElementById('admin-auth-container');
            const thAdmin = document.getElementById('th-admin-action');
            const thDispatch = document.getElementById('th-dispatch-action');
            const thSelectAll = document.getElementById('th-select-all');

            if (isAdminLoggedIn) {
                container.innerHTML = `
                    <button onclick="openPasswordModal()" class="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold px-4 py-2.5 rounded-xl text-sm transition-all border border-slate-300 shadow-sm" title="비밀번호 변경">
                        <i class="fa-solid fa-key text-slate-600"></i>
                        <span class="hidden sm:inline">비밀번호 변경</span>
                    </button>
                    <button onclick="handleAdminLogout()" class="inline-flex items-center gap-1.5 bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-800 font-bold px-4 py-2.5 rounded-xl text-sm transition-all shadow-sm">
                        <i class="fa-solid fa-crown text-amber-600"></i>
                        <span>로그아웃</span>
                    </button>
                `;
                if(thAdmin) thAdmin.classList.remove('hidden');
                if(thDispatch) thDispatch.classList.remove('hidden');
                if(thSelectAll) thSelectAll.classList.remove('hidden');
            } else {
                container.innerHTML = `
                    <button onclick="openLoginModal()" class="inline-flex items-center gap-1.5 bg-white hover:bg-slate-50 text-slate-800 font-bold px-4 py-2.5 rounded-xl text-sm transition-all border border-slate-300 shadow-sm">
                        <i class="fa-solid fa-lock text-slate-500"></i>
                        <span>관리자 로그인</span>
                    </button>
                `;
                if(thAdmin) thAdmin.classList.add('hidden');
                if(thDispatch) thDispatch.classList.add('hidden');
                if(thSelectAll) thSelectAll.classList.add('hidden');
            }
            updateStats();
        }

        function openLoginModal() {
            document.getElementById('admin-password').value = '';
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-password').value.trim();
            const savedPass = localStorage.getItem(PASSWORD_KEY) || 'admin1234';

            if (pass === savedPass) {
                isAdminLoggedIn = true;
                localStorage.setItem(ADMIN_LOGIN_KEY, 'true');
                closeLoginModal();
                renderAdminAuthUI();
                renderTable();
                showToast('관리자 로그인되었습니다.');
            } else {
                showToast('비밀번호가 일치하지 않습니다.');
            }
        }

        function handleAdminLogout() {
            isAdminLoggedIn = false;
            localStorage.removeItem(ADMIN_LOGIN_KEY);
            renderAdminAuthUI();
            renderTable();
            showToast('로그아웃되었습니다.');
        }

        function openPasswordModal() {
            document.getElementById('current-password').value = '';
            document.getElementById('new-password').value = '';
            document.getElementById('confirm-password').value = '';
            document.getElementById('password-modal').classList.remove('hidden');
        }

        function closePasswordModal() {
            document.getElementById('password-modal').classList.add('hidden');
        }

        function handlePasswordChange(e) {
            e.preventDefault();
            const currentPass = document.getElementById('current-password').value.trim();
            const newPass = document.getElementById('new-password').value.trim();
            const confirmPass = document.getElementById('confirm-password').value.trim();
            const savedPass = localStorage.getItem(PASSWORD_KEY) || 'admin1234';

            if (currentPass !== savedPass) {
                showToast('현재 비밀번호가 일치하지 않습니다.');
                return;
            }

            if (newPass.length < 4) {
                showToast('새 비밀번호는 최소 4자 이상이어야 합니다.');
                return;
            }

            if (newPass !== confirmPass) {
                showToast('새 비밀번호와 확인란이 일치하지 않습니다.');
                return;
            }

            localStorage.setItem(PASSWORD_KEY, newPass);
            closePasswordModal();
            showToast('관리자 비밀번호가 성공적으로 변경되었습니다.');
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('bg-white', 'text-slate-900', 'shadow-sm', 'font-bold');
                tab.classList.add('text-slate-600', 'font-semibold');
            });
            
            const activeId = filter === 'all' ? 'filter-all' : (filter === '발송완료' ? 'filter-completed' : 'filter-pending');
            const activeTab = document.getElementById(activeId);
            if (activeTab) {
                activeTab.classList.add('bg-white', 'text-slate-900', 'shadow-sm', 'font-bold');
                activeTab.classList.remove('text-slate-600', 'font-semibold');
            }

            renderTable();
        }

        function formatShortDate(dateStr) {
            if (!dateStr || dateStr.length < 10) return dateStr || '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[0].slice(2)}-${parts[1]}-${parts[2]}`;
            }
            return dateStr;
        }

        function toggleSelectAll(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = masterCheckbox.checked;
            });
        }

        function deleteSelectedRecords() {
            if (!isAdminLoggedIn) return;
            const selectedCheckboxes = document.querySelectorAll('.row-checkbox:checked');
            if (selectedCheckboxes.length === 0) {
                showToast('삭제할 항목을 하나 이상 선택해주세요.');
                return;
            }

            if (confirm(`정말로 선택한 ${selectedCheckboxes.length}개의 항목을(를) 삭제하시겠습니까?`)) {
                const deletePromises = [];
                selectedCheckboxes.forEach(cb => {
                    const id = cb.value;
                    deletePromises.push(db.collection("exam_records").doc(id).delete());
                });

                Promise.all(deletePromises).then(() => {
                    loadRecords();
                    showToast('선택한 내역이 삭제되었습니다.');
                    const selectAllCb = document.getElementById('select-all-checkbox');
                    if (selectAllCb) selectAllCb.checked = false;
                }).catch((error) => {
                    console.error("일괄 삭제 실패: ", error);
                    showToast('삭제 중 오류가 발생했습니다.');
                });
            }
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const emptyState = document.getElementById('empty-state');
            const searchInputEl = document.getElementById('search-input');
            const query = searchInputEl ? searchInputEl.value.trim().toLowerCase() : '';

            tbody.innerHTML = '';

            const filteredRecords = records.filter(r => {
                const matchesFilter = !isAdminLoggedIn || currentFilter === 'all' || r.status === currentFilter;
                const rangesText = (r.examRanges || []).map(item => `${item.subject} ${item.publisher} ${item.author || ''} ${item.range}`).join(' ').toLowerCase();
                const matchesSearch = !isAdminLoggedIn || 
                                      r.studentName.toLowerCase().includes(query) ||
                                      r.schoolName.toLowerCase().includes(query) ||
                                      (r.grade || '').toLowerCase().includes(query) ||
                                      (r.manager || '').toLowerCase().includes(query) ||
                                      rangesText.includes(query);
                return matchesFilter && matchesSearch;
            });

            if (filteredRecords.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                filteredRecords.forEach(record => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50/80 transition-colors border-b border-slate-100";
                    
                    const isCompleted = record.status === '발송완료';
                    const badgeClass = isCompleted 
                        ? 'bg-emerald-100 text-emerald-800 border-emerald-300' 
                        : 'bg-rose-100 text-rose-800 border-rose-300';

                    const formattedDateRange = `${formatShortDate(record.startDate)} ~ ${formatShortDate(record.endDate)}`;

                    // 💡 저자 이름만 깔끔하게 출력되도록 수정
                    const rangesListHtml = (record.examRanges && record.examRanges.length > 0)
                        ? `<ul class="space-y-2 py-2">
                            ${record.examRanges.map(item => `
                                <li class="flex items-start gap-2.5 text-base text-slate-900 leading-relaxed font-semibold">
                                    <span class="inline-block w-2 h-2 rounded-full bg-blue-600 mt-2 shrink-0"></span>
                                    <span class="break-all"><strong>[${escapeHtml(item.subject)}]</strong> <span class="text-slate-700">(${escapeHtml(item.publisher)} / ${escapeHtml(item.author || '미기재')})</span> - <span class="text-blue-900">${escapeHtml(item.range)}</span></span>
                                </li>
                            `).join('')}
                           </ul>`
                        : '<span class="text-slate-400 italic text-sm">등록된 시험범위 없음</span>';

                    const managerDisplay = record.manager && record.manager.trim() !== '' 
                        ? escapeHtml(record.manager) 
                        : '<span class="text-slate-400 italic text-sm">미지정</span>';

                    const badgeClickAttr = isAdminLoggedIn ? `onclick="toggleStatus(${record.id})"` : '';
                    const badgeCursor = isAdminLoggedIn ? 'cursor-pointer hover:opacity-80' : 'cursor-default';

                    tr.innerHTML = `
                        ${isAdminLoggedIn ? `
                            <td class="py-5 px-3 text-center whitespace-nowrap">
                                <input type="checkbox" value="${record.id}" class="row-checkbox rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-5 h-5 cursor-pointer">
                            </td>
                        ` : ''}
                        <td class="py-5 px-3 font-bold text-slate-900 whitespace-nowrap text-center text-base break-all">${escapeHtml(record.studentName)}</td>
                        <td class="py-5 px-3 text-slate-800 font-semibold whitespace-nowrap text-base text-center break-all">${escapeHtml(record.schoolName)}</td>
                        <td class="py-5 px-2 text-slate-800 font-semibold whitespace-nowrap text-base text-center break-all">${escapeHtml(record.grade || '')}</td>
                        <td class="py-5 px-2 text-slate-700 font-bold font-mono text-sm whitespace-nowrap text-center">${formattedDateRange}</td>
                        <td class="py-5 px-6 text-slate-900 break-all">${rangesListHtml}</td>
                        <td class="py-5 px-4 text-slate-800 font-semibold whitespace-nowrap text-base text-center break-all">${managerDisplay}</td>
                        ${isAdminLoggedIn ? `
                            <td class="py-5 px-4 text-center whitespace-nowrap">
                                <button ${badgeClickAttr} class="inline-flex items-center px-3.5 py-1.5 rounded-full text-sm font-bold border ${badgeClass} ${badgeCursor} transition-opacity shadow-sm">
                                    <span class="w-2 h-2 rounded-full mr-2 ${isCompleted ? 'bg-emerald-600' : 'bg-rose-600'}"></span>
                                    ${record.status}
                                </button>
                            </td>
                            <td class="py-5 px-4 text-right whitespace-nowrap">
                                <button onclick="openModal('edit', ${record.id})" class="text-slate-400 hover:text-blue-600 p-2 rounded-xl hover:bg-blue-50 transition-all mr-1" title="수정">
                                    <i class="fa-solid fa-pen-to-square text-lg"></i>
                                </button>
                                <button onclick="deleteRecord(${record.id})" class="text-slate-400 hover:text-rose-600 p-2 rounded-xl hover:bg-rose-50 transition-all" title="삭제">
                                    <i class="fa-solid fa-trash-can text-lg"></i>
                                </button>
                            </td>
                        ` : ''}
                    `;
                    tbody.appendChild(tr);
                });
            }

            updateStats();
        }

        function addRangeRow(data = {}) {
            const container = document.getElementById('range-list-container');
            const rowIdx = container.querySelectorAll('.range-row').length + 1;
            
            const rowDiv = document.createElement('div');
            rowDiv.className = 'range-row bg-slate-50 border border-slate-300 rounded-2xl p-4 space-y-3.5 transition-all shadow-sm';
            
            rowDiv.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-800 bg-white px-3 py-1.5 rounded-xl border border-slate-300">과목 ${rowIdx}</span>
                    <button type="button" onclick="removeRangeRow(this)" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors" title="항목 삭제">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">과목명 <span class="text-rose-500">*</span></label>
                        <input type="text" value="${escapeHtml(data.subject || '')}" required placeholder="예: 수학 I" class="input-subject w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-base font-semibold text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">출판사 <span class="text-rose-500">*</span></label>
                        <input type="text" value="${escapeHtml(data.publisher || '')}" required placeholder="예: 비상, 신사고" class="input-publisher w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-base font-semibold text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">대표저자 <span class="text-rose-500">*</span></label>
                        <input type="text" value="${escapeHtml(data.author || '')}" required placeholder="예: 류희찬" class="input-author w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-base font-semibold text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">시험범위 <span class="text-rose-500">*</span></label>
                    <input type="text" value="${escapeHtml(data.range || '')}" required placeholder="단원명 ~ 단원명" class="input-range w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-base font-semibold text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            `;
            container.appendChild(rowDiv);
            updateRangeRowLabels();
        }

        function removeRangeRow(btn) {
            const container = document.getElementById('range-list-container');
            if (container.querySelectorAll('.range-row').length > 1) {
                btn.closest('.range-row').remove();
                updateRangeRowLabels();
            } else {
                showToast('최소 한 개 이상의 시험범위 항목이 필요합니다.');
            }
        }

        function updateRangeRowLabels() {
            const rows = document.querySelectorAll('#range-list-container .range-row');
            rows.forEach((row, idx) => {
                const labelSpan = row.querySelector('.range-row span.font-bold');
                if (labelSpan) {
                    labelSpan.innerText = `과목 ${idx + 1}`;
                }
            });
        }

        function toggleStatus(id) {
            if (!isAdminLoggedIn) return;
            const index = records.findIndex(r => r.id === id);
            if (index !== -1) {
                records[index].status = records[index].status === '발송완료' ? '미발송' : '발송완료';
                saveRecordToFirebase(records[index], () => {
                    showToast(`발송 상태가 '${records[index].status}'(으)로 변경되었습니다.`);
                });
            }
        }

        function openModal(mode, id = null) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const form = document.getElementById('data-form');
            const rangeContainer = document.getElementById('range-list-container');
            
            form.reset();
            rangeContainer.innerHTML = '';

            if (mode === 'edit' && id !== null) {
                const record = records.find(r => r.id === id);
                if (!record) return;

                modalTitle.innerText = '내역 수정 (관리자)';
                document.getElementById('edit-id').value = record.id;
                document.getElementById('studentName').value = record.studentName;
                document.getElementById('schoolName').value = record.schoolName;
                document.getElementById('grade').value = record.grade || '';
                document.getElementById('manager').value = record.manager || '';
                document.getElementById('startDate').value = record.startDate || '';
                document.getElementById('endDate').value = record.endDate || '';

                if (record.examRanges && record.examRanges.length > 0) {
                    record.examRanges.forEach(item => {
                        if (typeof item === 'string') {
                            addRangeRow({ subject: '과목', publisher: '미기재', author: '미기재', range: item });
                        } else {
                            addRangeRow(item);
                        }
                    });
                } else {
                    addRangeRow();
                }
            } else {
                modalTitle.innerText = '기출문제 신청';
                document.getElementById('edit-id').value = '';
                const today = new Date().toISOString().substring(0, 10);
                document.getElementById('startDate').value = today;
                document.getElementById('endDate').value = today;
                document.getElementById('manager').value = '';
                addRangeRow();
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            const editId = document.getElementById('edit-id').value;
            const rangeRows = document.querySelectorAll('.range-row');
            const examRanges = [];
            let isValidRanges = true;

            rangeRows.forEach(row => {
                const subject = row.querySelector('.input-subject').value.trim();
                const publisher = row.querySelector('.input-publisher').value.trim();
                const author = row.querySelector('.input-author').value.trim();
                const range = row.querySelector('.input-range').value.trim();

                if (!subject || !publisher || !author || !range) {
                    isValidRanges = false;
                }
                examRanges.push({ subject, publisher, author, range });
            });

            if (!isValidRanges || examRanges.length === 0) {
                showToast('모든 과목의 과목명, 출판사, 대표저자, 시험범위를 빠짐없이 입력하세요.');
                return;
            }

            const managerVal = document.getElementById('manager').value.trim();

            if (editId) {
                const index = records.findIndex(r => r.id === parseInt(editId, 10));
                if (index !== -1) {
                    const existingStatus = records[index].status || '미발송';
                    const updatedRecord = {
                        id: parseInt(editId, 10),
                        studentName: document.getElementById('studentName').value.trim(),
                        schoolName: document.getElementById('schoolName').value.trim(),
                        grade: document.getElementById('grade').value.trim(),
                        manager: managerVal,
                        startDate: document.getElementById('startDate').value,
                        endDate: document.getElementById('endDate').value,
                        examRanges: examRanges,
                        status: existingStatus
                    };
                    saveRecordToFirebase(updatedRecord, () => {
                        showToast('성공적으로 수정되었습니다.');
                    });
                }
            } else {
                const newId = records.length > 0 ? Math.max(...records.map(r => r.id)) + 1 : 1;
                const newRecord = {
                    id: newId,
                    studentName: document.getElementById('studentName').value.trim(),
                    schoolName: document.getElementById('schoolName').value.trim(),
                    grade: document.getElementById('grade').value.trim(),
                    manager: managerVal,
                    startDate: document.getElementById('startDate').value,
                    endDate: document.getElementById('endDate').value,
                    examRanges: examRanges,
                    status: '미발송'
                };
                saveRecordToFirebase(newRecord, () => {
                    showToast('기출문제 신청이 등록되었습니다.');
                });
            }

            closeModal();
        }

        function deleteRecord(id) {
            if (!isAdminLoggedIn) return;
            if (confirm('정말로 이 내역을 삭제하시겠습니까?')) {
                db.collection("exam_records").doc(id.toString()).delete().then(() => {
                    loadRecords();
                    showToast('내역이 삭제되었습니다.');
                }).catch((error) => {
                    console.error("삭제 실패: ", error);
                    showToast('삭제 중 오류가 발생했습니다.');
                });
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toastMessage.innerText = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
